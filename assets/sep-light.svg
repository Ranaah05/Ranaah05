<svg xmlns="http://www.w3.org/2000/svg" width="880" height="18" viewBox="0 0 880 18"><style>.blink{opacity:0;animation:blink 1.1s steps(1) 1.3s infinite}@keyframes blink{0%{opacity:1}50%{opacity:0}}.glint{transform:translateX(-160px);animation:glint 7s cubic-bezier(.5,0,.3,1) 1.6s infinite}@keyframes glint{0%{transform:translateX(-160px)}35%,100%{transform:translateX(1040px)}}.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 2.2s ease-out 1.2s infinite}@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}.ping{opacity:0;animation:ping 9s ease-in-out infinite both}@keyframes ping{0%{opacity:0}2%{opacity:1}7%{opacity:0}100%{opacity:0}}.up{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}</style><line x1="0" y1="9" x2="880" y2="9" stroke="#d8d8d8" stroke-width="1"/></svg>